services:
  db:
    image: mariadb
    # environment:
    #   MYSQL_ROOT_PASSWORD: abcd123

  phpmyadmin:
    image: phpmyadmin:fpm-alpine
    environment:
      PMA_ARBITRARY: 1
    volumes:
      - phpmyadmin_files:/var/www/html

  phpmyadmin_web:
    image: nginx:alpine
    ports:
      - 9999:80
    volumes:
      - phpmyadmin_files:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpmyadmin

volumes:
  phpmyadmin_files:
